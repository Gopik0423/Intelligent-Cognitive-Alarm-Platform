server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing -- any path that isn't a real
    # static file (e.g. /dashboard, /verify/3) must still serve index.html
    # so the app can boot and let React Router take over. Without this,
    # refreshing on any page other than "/" returns a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built static assets aggressively -- Vite fingerprints filenames
    # (e.g. index-abc123.js), so a new build always gets a new filename and
    # never serves stale cached content.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
